# Secret categories. Each NPC may hold 0–2 secrets, drawn at worldgen.
# `affinity_traits` bias the selection: an NPC carrying a matching virtue or
# vice is likelier to hold this kind of secret. `summary_template` strings
# accept `{{subject}}` (the holder's name) and `{{other}}` (an optional second
# party) substitutions.

[[category]]
name = "adultery"
description = "an illicit lover known only to the holder"
summary_templates = [
    "{{subject}} has been meeting {{other}} in secret",
    "{{subject}} keeps a lover who is not their spouse",
]
affinity_traits = ["Lustful", "Romantic"]
min_age = 20

[[category]]
name = "debt"
description = "an unpayable sum owed in private"
summary_templates = [
    "{{subject}} owes a sum they cannot repay",
    "{{subject}} has borrowed from a moneylender no one knows about",
]
affinity_traits = ["Greedy", "Vain"]

[[category]]
name = "parentage"
description = "a child whose true father or mother is hidden"
summary_templates = [
    "{{subject}}'s eldest child was not fathered by their spouse",
    "{{subject}} is not the natural parent of one of their children",
]
affinity_traits = ["Lustful", "Romantic"]
min_age = 25

[[category]]
name = "theft"
description = "an unrecovered theft they committed"
summary_templates = [
    "{{subject}} took silver from the chapel offering and was never caught",
    "{{subject}} stole grain from a neighbor's stores in a lean winter",
]
affinity_traits = ["Greedy", "Cowardly"]

[[category]]
name = "heresy"
description = "private doubt or forbidden practice"
summary_templates = [
    "{{subject}} no longer holds the village faith but pretends at piety",
    "{{subject}} has consulted a cunning-woman for what the priest would condemn",
]
affinity_traits = ["Curious", "Suspicious"]

[[category]]
name = "past_violence"
description = "blood on the hands, long since hidden"
summary_templates = [
    "{{subject}} killed someone in a brawl years past and was never named",
    "{{subject}} has struck down more than they let on in their younger years",
]
affinity_traits = ["Wrathful", "Bold"]
min_age = 25

[[category]]
name = "hidden_lineage"
description = "the holder is not who the village thinks they are"
summary_templates = [
    "{{subject}} took another's name when they came to the village years ago",
    "{{subject}} is of a bloodline they have never claimed in the open",
]
affinity_traits = ["Shrewd", "Suspicious"]
min_age = 30

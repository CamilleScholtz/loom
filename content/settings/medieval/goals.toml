# Goal library for the medieval setting. Each goal is an archetype an NPC can
# pursue; the engine scores them against the NPC's needs, traits, and values
# every tick and forms / resolves them through Event::GoalFormed / GoalResolved.

[[goal]]
kind = "eat"
summary_template = "to put something hot in the belly"
trait_affinity = []
value_affinity = [["Pleasure", 0.3], ["Family", 0.1]]

[goal.urgency]
op = "need"
need = "Hunger"

[goal.precondition]
op = "need_at_least"
need = "Hunger"
threshold = 0.4

[goal.resolve]
op = "need_below"
need = "Hunger"
threshold = 0.2


# Secret categories. Each NPC may hold 0–2 secrets, drawn at worldgen.
# `affinity_traits` bias the selection: an NPC carrying a matching virtue or
# vice is likelier to hold this kind of secret. `summary_template` strings
# accept `{{subject}}` (the holder's name) and `{{other}}` (an optional second
# party) substitutions.

[[category]]
name = "adultery"
description = "an illicit lover known only to the holder"
summary_templates = [
    "{{subject}} has been meeting {{other}} in the cargo bay after lights-down",
    "{{subject}} keeps a lover who is not their partner back at port",
]
affinity_traits = ["Lustful", "Romantic"]
min_age = 20

[[category]]
name = "debt"
description = "an unpayable sum owed in private"
summary_templates = [
    "{{subject}} owes the company more than a tour will clear",
    "{{subject}} has borrowed from a portside loan-shark no one knows about",
]
affinity_traits = ["Greedy", "Vain"]

[[category]]
name = "parentage"
description = "a child whose true father or mother is hidden"
summary_templates = [
    "{{subject}}'s eldest child was not fathered by their partner",
    "{{subject}} is not the natural parent of one of their children back at port",
]
affinity_traits = ["Lustful", "Romantic"]
min_age = 25

[[category]]
name = "theft"
description = "an unrecovered theft they committed"
summary_templates = [
    "{{subject}} skimmed a crate off the manifest at the last port and was never caught",
    "{{subject}} took a crewmate's bonus chits in a lean run",
]
affinity_traits = ["Greedy", "Cowardly"]

[[category]]
name = "heresy"
description = "private doubt or forbidden practice"
summary_templates = [
    "{{subject}} no longer keeps the rites the rest of the crew does, but pretends at piety",
    "{{subject}} has consulted a portside fortune-trade for what the chaplain would condemn",
]
affinity_traits = ["Curious", "Suspicious"]

[[category]]
name = "past_violence"
description = "blood on the hands, long since hidden"
summary_templates = [
    "{{subject}} killed someone in a portside brawl years past and was never named",
    "{{subject}} has put down more than they let on on a previous tour",
]
affinity_traits = ["Wrathful", "Bold"]
min_age = 25

[[category]]
name = "hidden_lineage"
description = "the holder is not who the crew thinks they are"
summary_templates = [
    "{{subject}} signed on under another name when they came aboard years ago",
    "{{subject}} is from a family they have never claimed on the manifest",
]
affinity_traits = ["Shrewd", "Suspicious"]
min_age = 30
